# 复制为 config.toml 后填写真实值；config.toml 已被 gitignore，不会入库
app_host = "127.0.0.1"
# 8000 被 Windows HTTP.sys 系统服务永久占用，故默认使用 8010
app_port = 8010
db_path = "data/assistant.db"

# 轮询间隔（秒）：体力 5 分钟 / 活动·公告 1 小时 / 资讯 4 小时
stamina_seconds = 300
activity_seconds = 3600
announcement_seconds = 3600
news_seconds = 14400

# 微信推送：provider = "serverchan" 或 "pushplus"；send_key 留空 = 功能可用但未启用
notify_provider = "serverchan"
notify_send_key = ""

# 提醒规则：体力满推送 / 体力满判定阈值（%）/ 活动临期提醒天数 / 轮询连续失败告警阈值
notify_stamina_full = true
stamina_threshold_percent = 90
activity_remind_days = 3
fail_notify_threshold = 3

# 鸣潮（库街区官服）：登录 kurobbs.com 后从请求头抓 token，uid 即库街区数字 id
wuwa_enabled = true
wuwa_token = ""
wuwa_user_id = ""
# 库街区 APP 端 token（可选）：用于探索度/数据坞等高级数据，抓包教程见 README；
# 留空不影响现有功能
wuwa_app_token = ""

# 以上配置均可用带 GA_ 前缀的环境变量覆盖（如 GA_NOTIFY_SEND_KEY）
# lol_enabled 控制英雄联盟适配器开关（默认 true）
