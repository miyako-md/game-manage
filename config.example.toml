# 首次使用复制为 config.toml；已有配置不要覆盖。真实配置不提交Git。
# 鸣潮、异环均在看板「社区账号」短信登录，无需填写token或抓包字段。
app_host = "127.0.0.1"
app_port = 8010
db_path = "data/assistant.db"

wuwa_enabled = true
nte_enabled = true
lol_enabled = true

# 游戏社区轮询间隔（秒）。B站使用独立的轮询间隔。
stamina_seconds = 300
activity_seconds = 3600
announcement_seconds = 3600
news_seconds = 14400
bilibili_history_days = 60
bilibili_poll_seconds = 600

# 社区凭据自动加密保存；留空使用数据库旁的 assistant.credentials.json。
auth_store_path = ""
auth_allowed_origins = ["http://127.0.0.1:8010", "http://localhost:8010", "http://127.0.0.1:5173", "http://localhost:5173"]

# 可选微信推送：send_key留空时不发送。provider可选serverchan或pushplus。
notify_provider = "serverchan"
notify_send_key = ""
notify_stamina_full = true
stamina_threshold_percent = 90
activity_remind_days = 3
fail_notify_threshold = 3

# 旧版手填token/roleBox字段仍受Settings兼容，正常使用不必填写。
# B站登录与游戏社区登录独立，在页面底部来源面板配置并加密保存。
# 以下为官方UP主的公开UID，不是个人账号。只对这两款手游应用B站主来源规则。
[bilibili_sources]
wuthering_waves = "1955897084"
nte = "3546636978489848"
