# Copy to an operator-owned path outside the checkout. Placeholders are not secrets.
cloud_accounts_enabled = true
cloud_db_path = "/var/lib/game-manage-cloud/identity.db"
cloud_data_root = "/var/lib/game-manage-cloud/data"
cloud_credentials_key_path = "/etc/game-manage-cloud/grants.key"
cloud_allowed_origins = ["https://game.rekibot.cloud"]
lol_enabled = false
cloud_private_poll_seconds = 900
cloud_public_poll_seconds = 21600
cloud_poll_concurrency = 4
cloud_provider_concurrency = 1
cloud_upstream_timeout_seconds = 120
# Enable only after operator setup in updater-setup.md.
system_update_enabled = false
system_update_install_root = "/opt/game-manage-cloud"
system_update_state_dir = "/var/lib/game-manage-updater"
# Optional public sources must be explicitly reviewed; no local credentials.
bilibili_sources = {}
# QQ_APP_ID and separate service token are provisioned by operator environment.

[runtime]
host = "127.0.0.1"
port = 8020
# Use immutable release path: static content may not traverse the current symlink.
frontend_dist = "/opt/game-manage-cloud/releases/RELEASE_REVISION/frontend/dist"
