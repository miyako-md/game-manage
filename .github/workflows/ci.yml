name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev --extra qq --python ${{ matrix.python }}
      - name: Backend tests
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Isolated runtime checks (never autostart)
        env:
          GA_RUN_RUNTIME_TESTS: '1'
        run: .\.venv\Scripts\python.exe -m pytest tests/test_powershell_runtime.py -q -k "not current_user_autostart"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --registry=https://registry.npmjs.org
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
  browser-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked render dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev --extra render
          .venv/bin/python -m playwright install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-noto-cjk
      - name: Allow this Chromium executable to create its sandbox
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          browsers = list((Path.home() / '.cache/ms-playwright').glob('chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell'))
          if len(browsers) != 1 or not browsers[0].is_file():
              raise SystemExit('Expected exactly one installed Chromium headless shell')
          executable = browsers[0].resolve()
          profile = 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile game-manage-qq-browser "' + str(executable) + '" flags=(unconfined) {\n  userns,\n}\n'
          (Path(os.environ['RUNNER_TEMP']) / 'game-manage-qq-browser').write_text(profile)
          PY
          sudo install -m 0644 "$RUNNER_TEMP/game-manage-qq-browser" /etc/apparmor.d/game-manage-qq-browser
          sudo apparmor_parser -r /etc/apparmor.d/game-manage-qq-browser
      - name: Build the shared cloud components
        run: |
          npm ci --prefix frontend --registry=https://registry.npmjs.org
          .venv/bin/python scripts/cloud/build_frontend.py --frontend frontend
      - name: Verify real offline browser rendering
        env:
          GA_RUN_BROWSER_TESTS: '1'
          DEBUG: 'pw:browser'
        run: .venv/bin/python -m pytest tests/test_qq_web_rendering.py tests/test_qq_web_payload.py -q
